<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <!-- Background Ocean Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Ambient Bubbles -->
  <circle cx="120" cy="140" r="18" fill="rgba(255,255,255,0.25)"/>
  <circle cx="390" cy="180" r="26" fill="rgba(255,255,255,0.2)"/>
  <circle cx="340" cy="360" r="14" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Swimmer Fish Group -->
  <g transform="translate(256, 260)">
    <!-- Tail Fin -->
    <path d="M -80 0 L -150 -55 L -120 0 L -150 55 Z" fill="#f59e0b" stroke="#0f172a" stroke-width="8"/>
    <!-- Main Body -->
    <ellipse cx="0" cy="0" rx="110" ry="80" fill="url(#bodyGrad)" stroke="#facc15" stroke-width="12"/>
    <!-- Side Fin -->
    <ellipse cx="-20" cy="25" rx="42" ry="24" transform="rotate(-15)" fill="#f59e0b" stroke="#0f172a" stroke-width="6"/>
    <!-- Big Eye -->
    <circle cx="50" cy="-24" r="26" fill="#ffffff"/>
    <circle cx="58" cy="-24" r="13" fill="#0f172a"/>
    <circle cx="54" cy="-30" r="6" fill="#ffffff"/>
  </g>
</svg>

